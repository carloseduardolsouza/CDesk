<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>CDesk — Logo</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 900px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 520px 380px; font-family: Archivo, system-ui, sans-serif">

<div style="grid-column: 1 / 3; background: #F4F6FA; display: flex; align-items: center; justify-content: center; gap: 44px; position: relative">
<svg role="img" aria-label="Símbolo do CDesk" width="210" height="210" viewBox="0 0 64 64">
<path d="M48 12H19a9 9 0 0 0-9 9v16a9 9 0 0 0 9 9h29" fill="none" stroke="{{azul}}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M23 56h16" fill="none" stroke="{{azul}}" stroke-width="6" stroke-linecap="round"></path>
<path d="M33 19L49 28.5L42 30.5L46.5 38.5L43 40.3L38.6 32.4L33 36.5Z" fill="#0B1B3F" stroke="#0B1B3F" stroke-width="1.5" stroke-linejoin="round"></path>
</svg>
<span style="font-size: 132px; font-weight: 800; letter-spacing: -0.045em; color: #0B1B3F; line-height: 1">CDesk</span>
<span style="position: absolute; left: 40px; top: 32px; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #4B5A75">Logo principal</span>
</div>

<div style="background: #0E1013; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 24px; position: relative">
<span style="position: absolute; left: 32px; top: 26px; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9AA3B2">Fundo escuro</span>
<div style="display: flex; align-items: center; gap: 22px">
<svg role="img" aria-label="Símbolo do CDesk em fundo escuro" width="96" height="96" viewBox="0 0 64 64">
<path d="M48 12H19a9 9 0 0 0-9 9v16a9 9 0 0 0 9 9h29" fill="none" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M23 56h16" fill="none" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"></path>
<path d="M33 19L49 28.5L42 30.5L46.5 38.5L43 40.3L38.6 32.4L33 36.5Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"></path>
</svg>
<span style="font-size: 64px; font-weight: 800; letter-spacing: -0.045em; color: #FFFFFF; line-height: 1">CDesk</span>
</div>
</div>

<div style="background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 28px; position: relative; border-top: 1px solid #E3E8F0">
<span style="position: absolute; left: 32px; top: 26px; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #4B5A75">Ícone do app</span>
<sc-for list="{{icones}}" as="i" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="width: {{i.px}}; height: {{i.px}}; border-radius: {{i.raio}}; background: {{azul}}; display: grid; place-items: center">
<svg aria-hidden="true" width="{{i.svg}}" height="{{i.svg}}" viewBox="0 0 64 64">
<path d="M48 12H19a9 9 0 0 0-9 9v16a9 9 0 0 0 9 9h29" fill="none" stroke="#FFFFFF" stroke-width="{{i.traco}}" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M23 56h16" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"></path>
<path d="M33 19L49 28.5L42 30.5L46.5 38.5L43 40.3L38.6 32.4L33 36.5Z" fill="#0B1B3F" stroke="#0B1B3F" stroke-width="1.5" stroke-linejoin="round"></path>
</svg>
</div>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #4B5A75">{{i.rotulo}}</span>
</div>
</sc-for>
<div style="position: absolute; left: 32px; right: 32px; bottom: 26px; display: flex; gap: 18px; flex-wrap: wrap">
<sc-for list="{{cores}}" as="c" hint-placeholder-count="3">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: #2A3550">
<span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 4px; background: {{c.hex}}; border: 1px solid #D5DCE6"></span>
{{c.nome}} <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; color: #4B5A75">{{c.hex}}</span>
</span>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"azul":{"editor":"color","default":"#2563EB","options":["#2563EB","#1D4ED8","#0369A1"]},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const azul = this.props.azul ?? '#2563EB';
return {
azul,
icones: [
{ px: '112px', raio: '26px', svg: '76', traco: '8', rotulo: '256 px' },
{ px: '64px', raio: '15px', svg: '44', traco: '8', rotulo: '64 px' },
{ px: '32px', raio: '8px', svg: '24', traco: '9', rotulo: '32 px' },
{ px: '16px', raio: '4px', svg: '13', traco: '10', rotulo: '16 px' }
],
cores: [
{ nome: 'Azul CDesk', hex: azul },
{ nome: 'Azul noite', hex: '#0B1B3F' },
{ nome: 'Azul claro', hex: '#3B82F6' }
]
};
}
}
</script>
</body>
</html>
