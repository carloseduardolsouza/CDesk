<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>CDesk — Pedido de acesso</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0D}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 600px; height: 700px; box-sizing: border-box; padding: 28px; background: #0A0B0D; font-family: Inter, system-ui, sans-serif; color: #E6E9EE; display: flex; align-items: center; justify-content: center">
<div role="alertdialog" aria-labelledby="pd-titulo" aria-describedby="pd-desc" style="width: 100%; box-sizing: border-box; background: #1E2126; border: 1px solid #343A44; border-radius: 16px; overflow: hidden; box-shadow: 0 28px 70px rgba(0,0,0,0.6)">

<div style="display: flex; align-items: center; gap: 16px; padding: 22px 24px; border-bottom: 1px solid #2A2E36">
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<h2 id="pd-titulo" style="margin: 0; font-size: 20px; font-weight: 700; color: #F2F4F7">Pedido de acesso</h2>
<span id="pd-desc" style="font-size: 14px; color: #A9B1BE">Alguém quer ver e controlar este computador.</span>
</div>
<div role="timer" aria-label="Recusa automática em {{restante}} segundos" style="flex: none; position: relative; width: 56px; height: 56px">
<svg aria-hidden="true" width="56" height="56" viewBox="0 0 56 56">
<circle cx="28" cy="28" r="23" fill="none" stroke="#2C313A" stroke-width="5"></circle>
<circle cx="28" cy="28" r="23" fill="none" stroke="{{anelCor}}" stroke-width="5" stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="{{anelOffset}}" transform="rotate(-90 28 28)"></circle>
</svg>
<span style="position: absolute; inset: 0; display: grid; place-items: center; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; font-weight: 700; color: {{anelCor}}">{{restante}}</span>
</div>
</div>

<div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 14px; padding: 14px; background: #15171B; border: 1px solid #2A2E36; border-radius: 12px">
<div aria-hidden="true" style="flex: none; width: 72px; height: 46px; border-radius: 6px; overflow: hidden; position: relative; background: linear-gradient(160deg, #1E3A8A 0%, #7C3AED 55%, #F59E0B 100%)">
<div style="position: absolute; left: 14%; top: 14%; width: 56%; height: 56%; background: #F4F6F9; border-radius: 2px"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(12,14,18,0.82)"></div>
</div>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 600; color: #F2F4F7">{{nome}}</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #A9B1BE">482 913 077</span>
</div>
<span style="flex: none; padding: 3px 10px; border-radius: 999px; background: {{seloFundo}}; border: 1px solid {{seloBorda}}; color: {{seloCor}}; font-size: 12px; font-weight: 600">{{selo}}</span>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 2px">
<legend style="padding: 0 0 8px; font-size: 13px; font-weight: 600; color: #C3C9D3">Permitir que essa pessoa</legend>
<label style="display: flex; align-items: center; gap: 12px; min-height: 40px; font-size: 14px"><input type="checkbox" checked="" disabled="" style="width: 18px; height: 18px; accent-color: #2563EB">Veja a tela<span style="margin-left: auto; font-size: 12px; color: #A9B1BE">Sempre</span></label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 40px; font-size: 14px"><input type="checkbox" checked="{{controle}}" onChange="{{alternarControle}}" style="width: 18px; height: 18px; accent-color: #2563EB">Use o mouse e o teclado</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 40px; font-size: 14px; color: #A9B1BE"><input type="checkbox" disabled="" style="width: 18px; height: 18px">Use a área de transferência<span style="margin-left: auto; padding: 2px 8px; border-radius: 999px; background: #262A31; font-size: 12px; color: #C3C9D3">Em breve</span></label>
</fieldset>

<div style="display: flex; gap: 10px; padding: 12px 14px; background: #2A2210; border: 1px solid #5C4813; border-radius: 10px; font-size: 13px; line-height: 1.5; color: #FCD98A">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M12 9v4M12 16h.01"></path></svg>
<span>Só aceite se foi você quem pediu ajuda a essa pessoa. Golpistas costumam ligar fingindo ser do banco ou do suporte técnico.</span>
</div>

<label style="display: flex; align-items: center; gap: 12px; min-height: 36px; font-size: 14px; color: #C3C9D3"><input type="checkbox" checked="{{lembrar}}" onChange="{{alternarLembrar}}" style="width: 18px; height: 18px; accent-color: #2563EB">Adicionar aos computadores permitidos</label>
</div>

<div style="display: flex; gap: 12px; padding: 16px 24px 22px">
<button style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; background: #262A31; border: 1px solid #343A44; border-radius: 10px; color: #E6E9EE; font-size: 15px; font-weight: 600">
Recusar
<kbd style="padding: 1px 6px; border: 1px solid #4A515C; border-radius: 4px; font-family: inherit; font-size: 11px; color: #A9B1BE">Esc</kbd>
</button>
<button style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; background: #2563EB; border: 0; border-radius: 10px; color: #FFFFFF; font-size: 15px; font-weight: 600">
Aceitar
<kbd style="padding: 1px 6px; border: 1px solid #7FA6F5; border-radius: 4px; font-family: inherit; font-size: 11px; color: #E3ECFF">Enter</kbd>
</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"conhecido":{"editor":"boolean","default":true},"$preview":{"width":600,"height":700}}'>
class Component extends DCLogic {
componentDidMount() {
this.setState({ restante: 30 });
this.timer = setInterval(() => {
const r = (this.state && this.state.restante) || 30;
this.setState({ restante: r <= 1 ? 30 : r - 1 });
}, 1000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const st = this.state || {};
const r = st.restante || 30;
const conhecido = this.props.conhecido ?? true;
const controle = st.controle !== undefined ? st.controle : true;
const lembrar = st.lembrar !== undefined ? st.lembrar : false;
const C = 144.5;
return {
restante: r,
anelOffset: (C * (1 - r / 30)).toFixed(1),
anelCor: r <= 10 ? '#F87171' : '#FBBF24',
nome: conhecido ? 'Escritório' : 'Computador desconhecido',
selo: conhecido ? 'Já conectou antes' : 'Primeira vez',
seloFundo: conhecido ? '#0F2A22' : '#2A2210',
seloBorda: conhecido ? '#1D4D3D' : '#5C4813',
seloCor: conhecido ? '#6EE7B7' : '#FCD98A',
controle,
lembrar,
alternarControle: () => this.setState({ controle: !controle }),
alternarLembrar: () => this.setState({ lembrar: !lembrar })
};
}
}
</script>
</body>
</html>
